# Render Blueprint Specification for SupportDeskAI
services:
  - type: web
    name: supportdesk-ai-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    # Builds can't reach the private database; migrations run just before deploy.
    preDeployCommand: "alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: supportdesk-db
          property: connectionString
      - key: TRUST_PROXY_HEADERS
        value: true
      - key: AI_PROVIDER
        value: mock
      - key: AI_API_KEY
        sync: false

databases:
  - name: supportdesk-db
    plan: free
    databaseName: supportdesk_db
    user: supportdesk_user

