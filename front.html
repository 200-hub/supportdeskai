<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SupportDesk AI — Embeddable Web Chat Widget</title>
  <style>
    :root {
      --primary: #14213D;
      --accent: #FCA311;
      --teal: #16B8A6;
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #0F172A;
      --muted: #64748B;
      --border: #E2E8F0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    
    .widget-container {
      width: 100%;
      max-width: 420px;
      height: 600px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    
    .widget-header {
      background: var(--primary);
      color: #fff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .widget-header h3 { font-size: 16px; font-weight: 600; }
    .widget-header p { font-size: 12px; color: var(--teal); margin-top: 2px; }
    .badge-status { width: 8px; height: 8px; background: #22C55E; border-radius: 50%; display: inline-block; margin-right: 6px; }

    .messages-area {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #F1F5F9;
    }

    .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; }
    .msg.bot { background: #FFFFFF; color: var(--text); border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 2px; }
    .msg.user { background: var(--primary); color: #FFFFFF; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg-time { font-size: 10px; color: var(--muted); margin-top: 4px; text-align: right; }

    .input-area {
      padding: 12px 16px;
      background: #FFFFFF;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }
    .input-area input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 10px 16px;
      font-size: 14px;
      outline: none;
    }
    .input-area input:focus { border-color: var(--teal); }
    .btn-send {
      background: var(--teal);
      color: #fff;
      border: none;
      border-radius: 24px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-send:hover { background: #0D9488; }
  </style>
</head>
<body>

  <div class="widget-container">
    <div class="widget-header">
      <div>
        <h3>SupportDesk AI Assistant</h3>
        <p><span class="badge-status"></span>Online • Grounded Support</p>
      </div>
    </div>

    <div class="messages-area" id="messagesArea">
      <div class="msg bot">
        Hello! How can we assist you today? Feel free to ask any question or report an issue.
        <div class="msg-time">Just now</div>
      </div>
    </div>

    <div class="input-area">
      <input type="text" id="chatInput" placeholder="Type a message..." onkeydown="if(event.key === 'Enter') sendMessage()">
      <button class="btn-send" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin.includes('8000') ? '' : 'http://localhost:8000';
    let visitorToken = null;

    async function initSession() {
      try {
        const res = await fetch(`${API_BASE}/api/v1/public/chat/init`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tenant_slug: 'default-tenant', visitor_name: 'Website Visitor' })
        });
        if (res.ok) {
          const data = await res.json();
          visitorToken = data.visitor_token;
        }
      } catch (e) {
        console.warn('Backend offline, running in mock chat preview mode');
      }
    }

    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      input.value = '';

      // Try AI chat deflection via API
      try {
        const res = await fetch(`${API_BASE}/api/v1/ai/chat`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(visitorToken ? { 'Authorization': `Bearer ${visitorToken}` } : {})
          },
          body: JSON.stringify({ query: text })
        });
        if (res.ok) {
          const data = await res.json();
          appendMessage(data.response, 'bot');
          return;
        }
      } catch (e) {}

      // Fallback response
      setTimeout(() => {
        appendMessage("Thank you for your message! Our engineering team has logged your inquiry and will follow up shortly.", 'bot');
      }, 600);
    }

    function appendMessage(text, type) {
      const area = document.getElementById('messagesArea');
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerText = text;

      const time = document.createElement('div');
      time.className = 'msg-time';
      time.innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      div.appendChild(time);

      area.appendChild(div);
      area.scrollTop = area.scrollHeight;
    }

    initSession();
  </script>
</body>
</html>
